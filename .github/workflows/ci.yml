name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Fileverse's Prettier settings, so copies pass their lint unchanged.
      - run: pnpm format:check
      # Tests that need a Bee node skip themselves here: CI has none.
      - run: pnpm test
      - run: pnpm build
